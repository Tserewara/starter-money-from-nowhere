name: bgym-money-from-nowhere

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: wallet
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 2s
      timeout: 2s
      retries: 20

  psp:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SERVICE_MODE: psp
    ports:
      - "58003:8001"
    command: ["uvicorn", "app:psp_app", "--host", "0.0.0.0", "--port", "8001"]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SERVICE_MODE: api
      DATABASE_URL: postgresql://wallet:wallet@postgres:5432/wallet
      PSP_URL: http://psp:8001
    ports:
      - "58004:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["uvicorn", "app:api_app", "--host", "0.0.0.0", "--port", "8000"]
